[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-engine"
version = "0.25.1.dev0"
description = "A deterministic companion-robot continuity engine with structured demand understanding and pluggable skills"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
provider = ["httpx>=0.27"]
semantic = ["sentence-transformers>=3.0"]
crypto = ["cryptography>=42.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
